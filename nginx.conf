server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Gzip text assets.
    gzip            on;
    gzip_types      text/css application/javascript image/svg+xml;
    gzip_min_length 256;

    # Serve files; fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for fingerprint-free static assets (bump on deploy as needed).
    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Don't cache HTML so updates show up immediately.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Basic security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
